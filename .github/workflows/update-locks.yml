name: Update lockfiles

on:
  schedule:
    # run every friday
    - cron: "0 0 * * 5"
  workflow_dispatch:

jobs:
  flake:
    name: Update flake.lock

    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0

      - name: Update Flakes
        run: |
          nix flake update --flake .
          nix flake update --flake ./dev

      - name: Create pull request
        id: create-pull-request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ github.token }}
          commit-message: "chore: update flakes"
          title: "chore: update flakes"
          signoff: true
          sign-commits: true
          branch: "update-flake-lock"

      - name: Run CI
        if: steps.create-pull-request.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml \
            --ref ${{ steps.create-pull-request.outputs.pull-request-branch }}

  ports:
    name: Update port sources

    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          # NOTE: Required for paws
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Update ports
        run: ./pkgs/paws.py

      - name: Create pull request
        id: create-pull-request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ github.token }}
          commit-message: "chore: update port sources"
          title: "chore: update port sources"
          signoff: true
          sign-commits: true
          branch: "update-ports"

      - name: Run CI
        if: steps.create-pull-request.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml \
            --ref ${{ steps.create-pull-request.outputs.pull-request-branch }}
