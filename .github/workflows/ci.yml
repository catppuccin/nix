name: CI

on:
  push:
    branches:
      - "main"
      - "release-*"
    paths:
      - "**.nix"
      - "flake.lock"

      - "pkgs/**"

      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - "main"
      - "release-*"
    paths:
      - "**.nix"
      - "flake.lock"

      - "pkgs/**"

      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  flake:
    name: Run Flake checks (${{ matrix.system }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            system: aarch64-darwin
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux

        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Maximize Space
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        if: ${{ matrix.os != 'macos-latest' }}
        with:
          overprovision-lvm: true
          remove-android: true
          remove-dotnet: true
          remove-codeql: true
          remove-haskell: true
          remove-docker-images: true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0

      - name: Install Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: catppuccin
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run tests
        env:
          SYSTEM: ${{ matrix.system }}
        # Some modules require IFD, so only evaluate for the current system
        run: |
          nix run \
            --inputs-from . \
            nixpkgs#nix-fast-build -- \
            --skip-cached --no-nom \
            --flake "./dev#checks.$SYSTEM"

  release-gate:
    name: Release Gate
    needs: [flake]

    runs-on: ubuntu-latest

    steps:
      - name: Exit with error
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
